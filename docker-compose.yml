services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage/app/public:/var/www/storage/app/public
    networks:
      - mobile_network
      - sso-server-main_sso_network     # เพิ่มบรรทัดนี้
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: mobile_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mobile_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mobile_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mobile_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: mobile_user
    ports:
      - "3307:3306"
    volumes:
      - mobile_db_data:/var/lib/mysql
    networks:
      - mobile_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mobile_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: mobile_user
      PMA_PASSWORD: secret
    networks:
      - mobile_network
    depends_on:
      - db

networks:
  mobile_network:
    driver: bridge
  sso-server-main_sso_network:    # เปลี่ยนจาก sso-server_sso_network
    external: true
    name: sso-server-main_sso_network

volumes:
  mobile_db_data:
